<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat UI</title>
    <link rel="stylesheet" href="chatt.css">  
  </head>
  <body>
      <!-- Top Bar -->
    <div class="top-bar">
      <button class="icon-btn top-add-btn" aria-label="Add">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>

      <div id="addContainer" class="add-container" style="display:none; align-items:center; gap:8px; margin-left:12px;">
        <input id="addUsername" type="text" placeholder="Enter username" style="padding:6px 8px; border-radius:6px; border:1px solid #ddd;">
        <button id="addConfirm" style="padding:6px 8px; border-radius:6px;">Add</button>
        <button id="addCancel" style="padding:6px 8px; border-radius:6px;">Cancel</button>
        <span id="addMsg" style="margin-left:8px;font-size:13px;color:#b45309"></span>
      </div>
  </div>

    <!-- Chat List (dynamically filled) -->
    <div class="chat-list" id="chatList"></div>

    <script>
      async function loadChats() {
        try {
          const res = await fetch('/api/v1/users/me/contacts', { credentials: 'include' });
          if (!res.ok) {
            console.error('Failed to load chats', res.status);
            return;
          }
          const users = await res.json();
          if (!Array.isArray(users)) { console.error('Unexpected response', users); return; }
          renderChats(users);
        } catch (err) {
          console.error('Failed to load chats', err);
        }
      }

      function renderChats(users) {
        const container = document.getElementById('chatList');
        container.innerHTML = '';
        users.forEach(u => {
          const item = document.createElement('div');
          item.className = 'chat-item';
          item.style.cursor = 'pointer';
          item.innerHTML = `
            <div class="chat-info">
              <div class="chat-name">${u.username}</div>
              <div class="chat-status">new message</div>
            </div>
          `;
          item.addEventListener('click', () => {
            const id = encodeURIComponent(u._id);
            const name = encodeURIComponent(u.username);
            window.location.href = `/chat.html?userId=${id}&username=${name}`;
          });
          container.appendChild(item);
        });
      }

            // Add-contact UI
      const addBtn = document.querySelector('.top-add-btn');
      const addContainer = document.getElementById('addContainer');
      const addInput = document.getElementById('addUsername');
      const addConfirm = document.getElementById('addConfirm');
      const addCancel = document.getElementById('addCancel');
      const addMsg = document.getElementById('addMsg');

      addBtn.addEventListener('click', () => {
        const isHidden = addContainer.style.display === 'none';
        addContainer.style.display = isHidden ? 'flex' : 'none';

        if (isHidden) {
          addInput.value = '';
          addMsg.textContent = '';
          addInput.focus();
        }
      });

      addCancel.addEventListener('click', () => {
        addContainer.style.display = 'none';
        addMsg.textContent = '';
      });

      addConfirm.addEventListener('click', addContact);

      addInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          addContact();
        }
      });

      async function addContact() {
        const username = addInput.value.trim();

        if (!username) {
          addMsg.textContent = 'Enter a username';
          return;
        }

        addConfirm.disabled = true;
        addMsg.textContent = 'Adding...';

        try {
          const res = await fetch('/api/v1/users/add', {
            method: 'POST',
            credentials: 'include',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              usernameToAdd: username
            })
          });

          const data = await res.json();

          if (!res.ok) {
            addMsg.textContent = data.error || 'Unable to add user';
            return;
          }

          addMsg.textContent = 'User added';
          addInput.value = '';

          await loadChats();

          setTimeout(() => {
            addContainer.style.display = 'none';
            addMsg.textContent = '';
          }, 1000);
        } catch (error) {
          console.error('Add contact failed:', error);
          addMsg.textContent = 'Network error';
        } finally {
          addConfirm.disabled = false;
        }
      }

      loadChats();
    </script>
  </body>
</html>
